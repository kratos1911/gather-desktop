name: Quality checks

# Manual only: no remote execution until explicitly dispatched by the user.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/worker -v
      - run: python -m unittest discover -s tests/evaluation -v
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run lint && npm run typecheck && npm run format:check && npm test && npm run build
        working-directory: apps/desktop
