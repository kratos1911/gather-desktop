name: gather-extraction
services:
  extractor:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    network_mode: none
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    stdin_open: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
